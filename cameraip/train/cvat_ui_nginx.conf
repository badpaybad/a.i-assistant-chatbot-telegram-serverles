server {
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_types
        text/html
        application/javascript
        application/x-javascript
        text/javascript
        application/wasm
        image/x-icon;

    location / {
        # Any route that doesn't exist on the server (e.g. /devices)
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        # Allow embedding in ToT Portal iframe
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:* http://127.0.0.1:* https://*.fossagentic.men https://*.tot.vn;";
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
}
