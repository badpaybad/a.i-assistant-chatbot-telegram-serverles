services:
  llm-proxy-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_proxy_monitoring
    restart: unless-stopped
    
    # Khi chạy trên Docker Desktop (Linux/macOS/Windows), dùng port mapping 8000:8000
    ports:
      - "8000:8000"

    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - POLICY_FILE=/app/policy_matrix.yaml
      - DB_PATH=/app/data/llm_audit.db
      - RELOAD=false

    volumes:
      # Gắn file cấu hình ma trận phân quyền để chỉnh sửa nóng từ bên ngoài Host
      - ./policy_matrix.yaml:/app/policy_matrix.yaml
      # Gắn thư mục lưu trữ cơ sở dữ liệu SQLite audit log
      - ./data:/app/data
      # Gắn mã nguồn ứng dụng để hot reload / phản ánh ngay lập tức
      - ./database.py:/app/database.py
      - ./token_utils.py:/app/token_utils.py
      - ./proxy_server.py:/app/proxy_server.py
      - ./static:/app/static

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
